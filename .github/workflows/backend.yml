name: Backend

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify Node.js
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript
        run: npx tsc --version

      - name: Build
        run: npm run build

      - name: Start server
        run: |
          npm start &
          sleep 5
          curl --fail http://localhost:3000/api/health
